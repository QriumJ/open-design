name: bake-plugin-previews# Post-merge + nightly bake of the home gallery's plugin previews.## Role after the pipeline rework (specs/change/20260618-plugin-preview-bake-# pipeline/spec.md): this workflow is the trusted UPLOADER + manifest review PR# writer + nightly BACKSTOP.#   - Pull requests validate the bake without secrets in#     bake-plugin-previews-pr.yml.#   - Manifest refreshes that need R2 credentials or a write-capable token happen#     here after merge, from trusted main code.#   - Fork contributions follow the same post-merge path.#   - Nightly re-runs catch transient bake failures and BAKE_VERSION bumps.# When it does need to land a manifest, it opens ONE rolling review PR (it cannot# push to protected main directly). Until a plugin is baked the gallery falls# back to its live example.html iframe, so there is no gap.on:  push:    branches: [main]    paths:      - 'plugins/_official/**'      - 'scripts/bake-plugin-previews.mjs'  schedule:    - cron: '0 18 * * *'→ Runs at 18:00 # nightly self-healing full sweep  workflow_dispatch: {}permissions:  contents: write # push the rolling manifest branch  pull-requests: write # open the review PR (gh pr create needs this; unset perms default to none)concurrency:  group: bake-plugin-previews  cancel-in-progress: falsejobs:  bake:    name: Bake plugin previews    runs-on: ubuntu-24.04    timeout-minutes: 90    steps:      - name: Checkout        uses: actions/checkout@v6.0.2        with:          # Do NOT persist the default GITHUB_TOKEN as a github.com credential.          # The rolling manifest branch is force-pushed below with the release-bot          # App token (`x-access-token:${APP_TOKEN}`) precisely so the resulting PR          # sync is attributed to app/open-design-release-bot and its CI runs          # automatically (a github-actions[bot]-attributed pull_request run is held          # as `action_required` — GitHub's bot-recursion gate — which starves          # bake-plugin-previews-automerge.yml, since that reactor only approves +          # enqueues on `workflow_run.conclusion == 'success'`). When checkout          # persists the GITHUB_TOKEN it installs an `http.https://github.com/.extraheader`          # Authorization header that overrides the inline App token on push, so the          # force-push authenticates as github-actions[bot] and the rolling PR's CI          # never runs without a manual "Approve and run". Nothing between here and          # the push needs the persisted credential (setup-workspace only touches the          # pnpm store; render/upload uses R2 creds; gh + push use the App token), so          # dropping it is safe and keeps the App token the sole push credential.          persist-credentials: false      - name: Setup workspace        uses: ./.github/actions/setup-workspace      - name: Render previews + publish clips to R2 (main only)        uses: ./.github/actions/bake-previews        with:          upload: ${{ github.repository == 'nexu-io/open-design' && github.ref == 'refs/heads/main' }}          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_REPOSITORY_ASSETS_AK }}          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_REPOSITORY_ASSETS_SK }}          r2-bucket: ${{ secrets.CLOUDFLARE_R2_REPOSITORY_ASSETS_BUCKET }}          r2-endpoint: ${{ secrets.CLOUDFLARE_R2_REPOSITORY_ASSETS_URL }}
